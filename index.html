<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Test Schwarz</title>
    <style>
        /* Erzwinge einen schwarzen Hintergrund für die Fehlersuche */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #info-text {
            position: absolute;
            top: 10px;
            color: #00ff00;
            z-index: 100;
        }
        model-viewer {
            width: 90%;
            height: 90%;
            background-color: #111111;
            border: 2px solid #333;
        }
    </style>
    
    <!-- Alternative Script-Quelle, falls die andere blockiert wurde -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

    <div id="info-text">Wenn du das hier liest, läuft das HTML. Warte auf das Modell...</div>

    <!-- 3D-Modell -->
    <model-viewer 
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        camera-controls 
        touch-action="pan-y" 
        shadow-intensity="1"
        alt="Astronaut">
    </model-viewer>

</body>
</html>
