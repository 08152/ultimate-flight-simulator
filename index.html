<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLB Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Hintergrund der gesamten Webseite auf dunkelgrau gesetzt */
            background-color: #1a1a1a; 
            font-family: sans-serif;
        }
        model-viewer {
            width: 90%;
            height: 90%;
            /* Hintergrund des 3D-Bereichs ebenfalls dunkelgrau gefärbt */
            background-color: #2a2a2a; 
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
    </style>
    <!-- Zuverlässiges JSDelivr CDN für die Model-Viewer Bibliothek -->
    <script type="module" src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Test-Modell von der offiziellen Google-Dokumentation -->
    <model-viewer 
        src="https://modelviewer.dev" 
        ar 
        camera-controls 
        touch-action="pan-y" 
        alt="Ein 3D-Modell eines Astronauten" 
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
