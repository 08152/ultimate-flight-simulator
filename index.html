<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Test Schwarz - Jet Fighter</title>
    <style>
        /* Erzwinge einen schwarzen Hintergrund */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #info-text {
            position: absolute;
            top: 15px;
            color: #00ff00;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 4px;
        }
        /* Styling für den Sketchfab Player */
        .sketchfab-embed-wrapper {
            width: 90%;
            height: 90%;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div id="info-text">Wenn du das hier liest, läuft das HTML. Warte auf das Modell...</div>

    <!-- Sketchfab 3D-Viewer für den Sky Fighter Jet -->
    <div class="sketchfab-embed-wrapper">
        <iframe 
            title="Sky fighter military jet" 
            allowfullscreen 
            mozallowfullscreen="true" 
            webkitallowfullscreen="true" 
            allow="autoplay; fullscreen; xr-spatial-tracking" 
            xr-spatial-tracking 
            execution-while-out-of-viewport 
            execution-while-not-rendered 
            web-share 
            src="https://sketchfab.com">
        </iframe>
    </div>

</body>
</html>
