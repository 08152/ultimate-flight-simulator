<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d0d !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #161616;
        }
    </style>
    <script type="module" src="https://unpkg.com"></script>
</head>
<body>

    <!-- Ersetze DEIN_MODELL.glb mit dem exakten Namen deiner Datei im Repository -->
    <model-viewer 
        id="viewer"
        src="1.glb" 
        camera-controls 
        touch-action="pan-y" 
        shadow-intensity="1"
        alt="Mein 3D Modell">
    </model-viewer>

</body>
</html>
